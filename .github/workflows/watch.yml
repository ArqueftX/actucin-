name: CinéWatch

on:
  schedule:
    - cron: "*/20 * * * *"   # toutes les 20 min (GitHub peut décaler de 5-15 min)
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode d'exécution"
        required: false
        default: "run"
        type: choice
        options: [run, check, seed, dry-run]

concurrency:
  group: cinewatch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Lancer la veille
        env:
          DISCORD_WEBHOOK_NEWS: ${{ secrets.DISCORD_WEBHOOK_NEWS }}
          DISCORD_WEBHOOK_RUMORS: ${{ secrets.DISCORD_WEBHOOK_RUMORS }}
        run: |
          case "${{ inputs.mode || 'run' }}" in
            check)   python watcher.py --check ;;
            seed)    python watcher.py --seed ;;
            dry-run) python watcher.py --dry-run ;;
            *)       python watcher.py ;;
          esac

      - name: Sauvegarder l'état
        if: ${{ inputs.mode != 'check' && inputs.mode != 'dry-run' }}
        run: |
          git config user.name  "cinewatch-bot"
          git config user.email "actions@github.com"
          git add state/seen.json
          if git diff --staged --quiet; then
            echo "Aucun changement d'état."
          else
            git commit -m "state: maj veille [skip ci]"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
          fi
